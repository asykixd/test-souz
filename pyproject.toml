[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "product-card-assistant"
version = "0.1.0"
description = "Grounded B2B product card drafts for measuring instruments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
product-card = "product_card.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/product_card"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
